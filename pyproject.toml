[project]
name = "ci-triage-agent"
version = "0.1.0"
description = "AI agent that triages failed GitHub Actions runs: log analysis, RAG over past issues and human-in-the-loop review."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "Nikolas Kraljevic", email = "nikolas.kraljevic@outlook.com" }
]
requires-python = ">=3.12"
keywords = ["ai-agents", "llm", "langgraph", "rag", "ci-cd", "github-actions"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Repository = "https://github.com/NK8007/ci-triage-agent"
Issues = "https://github.com/NK8007/ci-triage-agent/issues"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting (isort)
    "B",        # common bugs (bugbear)
    "UP",       # modern Python syntax (pyupgrade)
    "SIM",      # simplifications
    "ASYNC",    # async pitfalls
    "PT",       # pytest style
    "RUF",      # Ruff-specific rules
]

[tool.mypy]
strict = true
files = ["src", "tests"]
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: needs network access or real API keys (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["ci_triage_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
