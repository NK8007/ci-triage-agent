[project]
name = "ci-triage-agent"
version = "0.1.0"
description = "AI agent that triages failed GitHub Actions runs: log analysis, RAG over past issues and human-in-the-loop review."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "Nikolas Kraljevic", email = "nikolas.kraljevic@outlook.com" }
]
requires-python = ">=3.12"
keywords = ["ai-agents", "llm", "langgraph", "rag", "ci-cd", "github-actions"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Repository = "https://github.com/NK8007/ci-triage-agent"
Issues = "https://github.com/NK8007/ci-triage-agent/issues"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"